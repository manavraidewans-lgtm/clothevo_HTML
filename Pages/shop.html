<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothevo | Build a Fashion</title>
    <link rel="icon" href="../Assets/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pliant:ital,wdth,wght@0,100..125,100..900;1,100..125,100..900&display=swap" rel="stylesheet">

    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <link rel="stylesheet" href="../styleSheets/shop.css">
    
</head>
<body>
    
    <header>

       

        <!--NavBar-->
        <section id="navBar">

            <div class="navbar-logo">
                <a href="#">
                    <img src="../Assets/Logo.png" alt=" Webite Icon">
                </a>
            </div>

            <div class="navbar-links" id="navLinks">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="#" class="active">Shop</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="navbar-icons">
                <span>

                    <div id="searchBtn">
                        <i class="ri-search-line"></i>
                        <input
                            type="text"
                            id="searchInp"
                            placeholder="Search Your Item"
                        >
                    </div>
                    
                    <button id="login-btn">
                        <i class="ri-user-line"></i>
                    </button>

                   <button onclick="goToFav()">
                        <i class="ri-heart-line"></i>
                    </button>

                    <button onclick="goToCart()">
                        <i class="ri-shopping-bag-line"></i>
                    </button>

                </span>

                 <!--Hamburger-->
                <div class="hamburger" id="hamburger">
                    <i class="ri-menu-3-line"></i>
                </div>
            </div>
        </section>



        






        
        <!--Login Popup-->
        <div class="login-popup" id="login-popup">
                
            <div class="login-outer">

                <div class="login-close">
                    <button id="login-close">
                        <i class="ri-close-fill"></i>
                    </button>
                </div>

                <div class="login-heading">
                    <h1>Welcome Back!</h1>
                </div>

                <form action="">

                    <div class="form-card">
                        <label for="email">Email : &nbsp; </label>
                        <input type="text" id="email" placeholder="Enter E-mail">
                    </div>
                    <div class="form-card">
                        <label for="pass">Password : &nbsp; </label>
                        <input type="text" id="pass" placeholder="Enter Password">
                    </div>
                    
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember"> &nbsp; Remember Me</label>
                    </div>

                    <div class="form-card">
                        <button>
                            Submit 
                            <i class="ri-login-circle-line"></i>
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </header>

    <!--details -->
    <section id="details" class="flex">
                <div class="details-outer">

                    <div class="cards-details">
                        <i class="ri-truck-fill"></i>
                        <p>Free shipping over ₹900</p>
                    </div>
                    <span class="divider">|</span>
                    <div class="cards-details">
                        <i class="ri-refresh-line"></i>
                        <p>Easy 30-Days returns</p>
                    </div>
                    <span class="divider">|</span>
                    <div class="cards-details">
                        <i class="ri-wallet-fill"></i>
                        <p>Cash On Delivery</p>
                    </div>
                </div>
    </section>


    <!--    main   -->

    <div class="main-outer flex">

        <div class="aside">

            <!--gender-->
            <div class="gender">
                <h1>Gender</h1>
                <div class="check">
                    <input type="checkbox" id="men" name="men">
                    <label for="men">Men</label>
                </div>
                <div class="check">
                    <input type="checkbox" id="women" name="men">
                    <label for="women">Women</label>
                </div>
                <div class="check">
                    <input type="checkbox" id="uni" name="uni">
                    <label for="uni">Unisex</label>
                </div>
            </div>

            <!--categories-->
            <div class="categories">

                 <h1>Categories</h1>   
                
                <ul>
                    <li>T-Shirt</li>
                    <li>Shirts</li>
                    <li>Hoodies</li>
                    <li>Sweatshirt</li>
                    <li>Skirts</li>
                    <li>Jeans</li>
                    <li>Pants</li>
                </ul>
            </div>

            <div class="clear-btn">
                <button id="reset">
                    Clear All
                    <i class="ri-eraser-line"></i>
                </button>
            </div>
            
        </div>

        <div class="cards-section">
            <div class="card-section-top">
                <input type="text" id="search-bar" placeholder="Search for your item">
                <div class="sort flex">
                        <label for="sorting">Sort By :</label>
                        <select name="sorting" id="sorting"> 
                            <option value="">Feature</option>
                            <option value="Low">Low - High</option>
                            <option value="High">High - Low</option>
                        </select>
                </div>
            </div>

            <div class="cards-outer">

            </div>

        </div>

    </div>
        








    <footer class="flex">

        <div class="footer-out">

            <div class="footer-left">
                <p>
                    © 2024 CV Store. All rights rserved.
                </p>
            </div>

            <div class="footer-right">
                <i class="ri-visa-line"></i>
                <i class="ri-mastercard-fill"></i>
                <i class="ri-paypal-fill"></i>
                <i class="ri-wallet-fill"></i>
            </div>
        </div>

    </footer>

    <script src="../Logic/shop.js"></script>
</body>
