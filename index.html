<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothevo | Build a Fashion</title>
    <link rel="icon" href="Assets/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pliant:ital,wdth,wght@0,100..125,100..900;1,100..125,100..900&display=swap" rel="stylesheet">

    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    <header>

       

        <!--NavBar-->
        <section id="navBar">

            <div class="navbar-logo">
                <a href="#">
                    <img src="Assets/Logo.png" alt=" Webite Icon">
                </a>
            </div>

            <div class="navbar-links">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="Pages/about.html">About</a></li>
                    <li><a href="Pages/shop.html">Shop</a></li>
                    <li><a href="Pages/contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="navbar-icons">
                <span>

                    <button>
                        <i class="ri-search-line"></i>
                    </button>
                    
                    <button id="login-btn">
                        <i class="ri-user-line"></i>
                    </button>

                    <button>
                        <i class="ri-heart-line"></i>
                    </button>

                    <button>
                        <i class="ri-shopping-bag-line"></i>
                    </button>

                </span>
            </div>
            

            <!-- Background Video -->
        <video autoplay muted loop playsinline class="bg-video" loading="lazy">
            <source src="Assets/Hero-background.mp4" type="video/mp4">
        </video>

        <!-- Dark Overlay -->
        <div class="overlay"></div>

         <!-- Text -->
        <div class="hero-content">
            <p id="new">New Collection 2026</p>
            <h1>Elevate Your <br> Everyday Style</h1>
            <p id="new-2">Timeless fashion for everyone. <br>
                Crafted for comfort, made to stand out.
            </p>

            <div class="hero-but">
                <button id="trend">
                    Trending Items
                    <i class="ri-fire-line"></i>
                </button>

                <button id="collection">
                    Explore Collections
                    <i class="ri-arrow-right-long-line"></i>
                </button>
            </div>
        </div>
        </section>



        






        
        <!--Login Popup-->
        <div class="login-popup" id="login-popup">
                
            <div class="login-outer">

                <div class="login-close">
                    <button id="login-close">
                        <i class="ri-close-fill"></i>
                    </button>
                </div>

                <div class="login-heading">
                    <h1>Welcome Back!</h1>
                </div>

                <form action="">

                    <div class="form-card">
                        <label for="email">Email : &nbsp; </label>
                        <input type="text" id="email" placeholder="Enter E-mail">
                    </div>
                    <div class="form-card">
                        <label for="pass">Password : &nbsp; </label>
                        <input type="text" id="pass" placeholder="Enter Password">
                    </div>
                    
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember"> &nbsp; Remember Me</label>
                    </div>

                    <div class="form-card">
                        <button>
                            Submit 
                            <i class="ri-login-circle-line"></i>
                        </button>
                    </div>

                </form>

            </div>

        </div>


    </header>



    <main>




    </main>



















    <script src="app.js"></script>
</body>
</html>
